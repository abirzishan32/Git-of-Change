# Local stack: MongoDB, the API and the client behind nginx.
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
# Stripe keys are picked up from server/.env if it exists.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: server/.env
        required: false
    environment:
      NODE_ENV: production
      # Pinned here so a PORT in server/.env can't desync the proxy and port mapping
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/gift-of-change
      CLIENT_URL: http://localhost:8080
      TRUST_PROXY: 'true'
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  mongo-data:
