server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Client-side routes must fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied so the browser talks to one origin. The variable keeps nginx
    # from failing at startup when the API container isn't running yet.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://server:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
